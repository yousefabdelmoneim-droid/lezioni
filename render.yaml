services:
  - type: web
    name: lezioni-private
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    envVars:
      - key: SECRET_KEY
        generateValue: true
    disk:
      name: db
      mountPath: /opt/render/project/src
      sizeGB: 1
